<title>I Am Disiplin</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;700;800&family=Manrope:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: tek kolon mobil uygulama kabuğu, alt sekme çubuğu; kimlik oyları ana motif */
:root{
  --bg:#f3f4ef; --card:#ffffff; --fg:#1b2420; --muted:#66706a; --line:#dfe3dc;
  --accent:#1f6b52; --accent-soft:#dcece4; --mini:#c98a1b; --mini-soft:#f6ead2;
  --display:"Bricolage Grotesque",system-ui,sans-serif; --body:"Manrope",system-ui,sans-serif; --mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121815;--card:#1b231f;--fg:#e8ede9;--muted:#93a199;--line:#2b3631;--accent:#5fc49c;--accent-soft:#1f3a2f;--mini:#e3ad4c;--mini-soft:#3a2f1a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121815;--card:#1b231f;--fg:#e8ede9;--muted:#93a199;--line:#2b3631;--accent:#5fc49c;--accent-soft:#1f3a2f;--mini:#e3ad4c;--mini-soft:#3a2f1a;color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5}
.app{max-width:480px;margin:0 auto;padding:16px 16px 96px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
h2{font-size:19px;font-weight:700}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:10px;padding:8px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn-primary{background:var(--accent);color:var(--bg);border-color:var(--accent);font-weight:700}
.btn-mini{background:var(--mini-soft);border-color:var(--mini);color:var(--fg)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:999px;padding:7px 12px}
.chip.on{background:var(--accent-soft);border-color:var(--accent);font-weight:700}
input,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.habit{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}
.habit .meta{font-size:12px;color:var(--muted)}
.state{font-family:var(--mono);font-size:12px;padding:3px 8px;border-radius:999px}
.state.done{background:var(--accent-soft);color:var(--accent)} .state.mini{background:var(--mini-soft);color:var(--mini)}
.bar{height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent)}
.votes{display:flex;gap:10px;flex-wrap:wrap}
.vote{display:flex;flex-direction:column;padding:8px 12px;border-radius:12px;background:var(--accent-soft)}
.vote b{font-family:var(--display);font-size:22px}
.heat{display:grid;grid-template-columns:repeat(12,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--line);max-width:100%}
.heat i.l1{background:var(--mini)} .heat i.l2{background:color-mix(in srgb,var(--accent) 60%,var(--bg))} .heat i.l3{background:var(--accent)}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs div{display:flex;gap:6px;max-width:480px;width:100%}
.tabs button{flex:1;border:none;font-weight:700;color:var(--muted)}
.tabs button.on{color:var(--accent);background:var(--accent-soft)}
.flow{display:flex;flex-direction:column;gap:6px;counter-reset:s}
.flow div{padding:8px 10px;border-left:3px solid var(--accent);background:var(--bg);border-radius:6px}
pre{font-family:var(--mono);font-size:12px;background:var(--bg);padding:10px;border-radius:8px;overflow-x:auto;margin:0}
.tag{font-size:11px;font-weight:700;color:var(--mini)}
</style>

<div class="app" id="app"></div>
<nav class="tabs" id="tabs" hidden><div>
  <button id="t-today" data-v="today">Bugün</button>
  <button id="t-prog" data-v="prog">İlerleme</button>
  <button id="t-plan" data-v="plan">Plan</button>
</div></nav>

<script>
const IDENT=["Okuyan","Fit","Dil bilen","Üreten","Sakin zihin","Girişimci"];
const PACKS={
 "Okuma + Dil + Hareket":[
  {n:"Kitap oku",t:"dur",goal:30,mini:10,u:"dk",id:"Okuyan"},
  {n:"Yeni kelime",t:"qty",goal:50,mini:10,u:"kelime",id:"Dil bilen"},
  {n:"Koşu",t:"qty",goal:5,mini:1,u:"km",id:"Fit"}],
 "Sabah rutini":[
  {n:"Meditasyon",t:"dur",goal:10,mini:2,u:"dk",id:"Sakin zihin"},
  {n:"Yoga",t:"dur",goal:60,mini:10,u:"dk",id:"Fit"},
  {n:"Soğuk duş",t:"bool",goal:1,mini:1,u:"",id:"Sakin zihin"}],
 "Girişimci":[
  {n:"Derin çalışma",t:"dur",goal:90,mini:25,u:"dk",id:"Üreten"},
  {n:"İş kitabı oku",t:"qty",goal:20,mini:5,u:"sayfa",id:"Girişimci"},
  {n:"Günlük yaz",t:"bool",goal:1,mini:1,u:"",id:"Üreten"}]
};
const MAX_START=3;
const day=d=>d.toISOString().slice(0,10);
const today=day(new Date());
function load(){try{return JSON.parse(localStorage.getItem("iad")||"null")}catch(e){return null}}
function save(){try{localStorage.setItem("iad",JSON.stringify(S))}catch(e){}}

function seed(){ // örnek veri: 84 gün geçmiş
  const habits=PACKS["Okuma + Dil + Hareket"].map((h,i)=>({...h,key:"h"+i}));
  const log={};
  for(let k=84;k>=1;k--){const d=new Date();d.setDate(d.getDate()-k);const ds=day(d);log[ds]={};
    habits.forEach(h=>{const r=Math.random();if(r<.62)log[ds][h.key]={v:h.goal,lvl:2};else if(r<.8)log[ds][h.key]={v:h.mini,lvl:1};});}
  return {skips:{},reviews:{},onboarded:true,example:true,name:"Örnek kullanıcı",ids:["Okuyan","Dil bilen","Fit"],habits,log,view:"today"};
}
let S=load()||{onboarded:false,ids:[],habits:[],log:{},view:"today"};
let ob={step:0,ids:[],pack:null,custom:[]};

function strength(h){let s=0;const days=Object.keys(S.log).sort();
  days.forEach(d=>{const e=S.log[d][h.key];const x=e?(e.lvl===2?1:.6):0;s+= (x-s)*.08;});return Math.round(s*100);}
function streak(h){let n=0;const d=new Date();for(;;){const e=(S.log[day(d)]||{})[h.key];if(e)n++;else if(day(d)!==today)break;d.setDate(d.getDate()-1);if(n>999)break}return n}
function avgPerDay(h){const days=Object.keys(S.log).slice(-30);let t=0;days.forEach(d=>{const e=S.log[d][h.key];if(e)t+=e.v});return days.length?t/days.length:0}

const $=s=>document.getElementById(s);
const yday=()=>{const d=new Date();d.setDate(d.getDate()-1);return day(d)};
const weekKey=()=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7));return day(d)};
function missedYesterday(){S.skips=S.skips||{};const y=yday();if(!S.log[y])return S.habits.filter(()=>false);
  return S.habits.filter(h=>!(S.log[y]||{})[h.key]&&!((S.skips[y]||{})[h.key]))}
function longest(h){let b=0,c=0;Object.keys(S.log).sort().forEach(d=>{if(S.log[d][h.key]){c++;b=Math.max(b,c)}else c=0});return b}
function total(h){return Object.values(S.log).filter(m=>m[h.key]).length}
function badges(){const L=[[7,"Başlangıç","seri"],[21,"Tutarlı","seri"],[66,"Alışkanlık","toplam"],[100,"Kimlik","toplam"]];const out=[];
  S.habits.forEach(h=>L.forEach(([n,t,k])=>{const v=k==="seri"?longest(h):total(h);out.push({t:h.id+": "+t,d:h.n+" · "+(k==="seri"?n+" günlük seri":"toplam "+n+" gün"),ok:v>=n,p:Math.min(1,v/n)})}));
  return out.sort((a,b)=>b.ok-a.ok)}
function render(){
  const a=$("app");$("tabs").hidden=!S.onboarded;
  if(!S.onboarded){a.innerHTML=onboardHTML();return bindOb()}
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===S.view));
  a.innerHTML=(S.example?`<div class="card small"><span class="tag">ÖRNEK VERİ</span>12 haftalık örnek geçmişle açıldı. <button id="reset">Kendi programımı kur</button></div>`:"")+
   ({today:todayHTML,prog:progHTML,plan:planHTML})[S.view]();
  bind();
}

/* ---------- ONBOARDING ---------- */
function onboardHTML(){
  if(ob.step===0)return `<div class="eyebrow">Adım 1 / 2</div><h1>Nasıl bir insan olmak istiyorsun?</h1>
   <p class="muted">Birkaç kimlik seç. Her alışkanlık bunlardan birine oy verecek.</p>
   <div class="chips">${IDENT.map(i=>`<button class="chip ${ob.ids.includes(i)?"on":""}" data-id="${i}">${i}</button>`).join("")}</div>
   <button class="btn-primary" id="next" ${ob.ids.length?"":"disabled"}>Devam</button>`;
  const cnt=ob.pack?PACKS[ob.pack].length:ob.custom.length;
  return `<div class="eyebrow">Adım 2 / 2</div><h1>Programını kur</h1>
   <p class="muted small">İlk 2 hafta en fazla ${MAX_START} alışkanlık. Az başla, kalıcı ol.</p>
   <h2>Hazır paket</h2><div class="chips">${Object.keys(PACKS).map(p=>`<button class="chip ${ob.pack===p?"on":""}" data-pack="${p}">${p}</button>`).join("")}</div>
   <h2>veya kendin ekle</h2>
   <div class="card">
    <input id="cn" placeholder="Örn: Yoga">
    <div class="row"><select id="ct"><option value="dur">Süre</option><option value="qty">Miktar</option><option value="bool">Evet/Hayır</option></select>
    <input id="cg" class="grow" type="number" placeholder="Hedef (60)"><input id="cu" class="grow" placeholder="Birim (dk)"></div>
    <div class="row"><input id="cm" class="grow" type="number" placeholder="Kötü gün minimumu (10)">
    <select id="ci">${ob.ids.map(i=>`<option>${i}</option>`).join("")}</select></div>
    <button id="add" ${ob.custom.length>=MAX_START?"disabled":""}>+ Ekle</button>
    ${ob.custom.map(h=>`<div class="small">• ${h.n} — ${h.goal} ${h.u} (min ${h.mini}) → ${h.id}</div>`).join("")}
   </div>
   <button class="btn-primary" id="finish" ${cnt?"":"disabled"}>Başla (${cnt} alışkanlık)</button>`;
}
function bindOb(){
  document.querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{const i=b.dataset.id;ob.ids=ob.ids.includes(i)?ob.ids.filter(x=>x!==i):[...ob.ids,i];render()});
  $("next")&&($("next").onclick=()=>{ob.step=1;render()});
  document.querySelectorAll("[data-pack]").forEach(b=>b.onclick=()=>{ob.pack=ob.pack===b.dataset.pack?null:b.dataset.pack;ob.custom=[];render()});
  $("add")&&($("add").onclick=()=>{const n=$("cn").value.trim();if(!n)return;const t=$("ct").value;
    ob.custom.push({n,t,goal:t==="bool"?1:+$("cg").value||1,mini:t==="bool"?1:+$("cm").value||1,u:t==="bool"?"":$("cu").value||(t==="dur"?"dk":""),id:$("ci").value});ob.pack=null;render()});
  $("finish")&&($("finish").onclick=()=>{const list=ob.pack?PACKS[ob.pack]:ob.custom;
    S={skips:{},reviews:{},onboarded:true,ids:ob.ids,habits:list.map((h,i)=>({...h,key:"h"+i})),log:{},view:"today"};save();render()});
}

/* ---------- BUGÜN ---------- */
function todayHTML(){
  const L=S.log[today]||{};const votes={};
  S.habits.forEach(h=>{const e=L[h.key];if(e)votes[h.id]=(votes[h.id]||0)+(e.lvl===2?2:1)});
  const doneN=S.habits.filter(h=>L[h.key]).length;
  return `<div><div class="eyebrow">${new Date().toLocaleDateString("tr-TR",{weekday:"long",day:"numeric",month:"long"})}</div>
   <h1>Bugün ${doneN}/${S.habits.length}</h1></div>
   <div class="card"><div class="eyebrow">Bugün verdiğin kimlik oyları</div>
   <div class="votes">${S.ids.map(i=>`<div class="vote"><b class="num">${votes[i]||0}</b><span class="small">${i}</span></div>`).join("")}</div>
   <div class="small muted">Tam hedef = 2 oy, minimum = 1 oy. Her oy "ben buyum" demek.</div></div>
   ${missedYesterday().map(h=>`<div class="card"><b>Dün "${h.n}" olmadı. Ne oldu?</b><span class="small muted">Suçlama yok, sadece sistemi ayarlıyoruz.</span>
     <div class="chips">${["Yorgun","Vakit yok","Unuttum","İsteksiz"].map(r=>`<button class="chip" data-skip="${h.key}" data-r="${r}">${r}</button>`).join("")}</div></div>`).join("")}
   ${new Date().getDay()===0&&!(S.reviews||{})[weekKey()]?`<div class="card"><b>Haftalık değerlendirme</b>
     <input id="rv1" placeholder="Bu hafta ne iyi gitti?"><input id="rv2" placeholder="Ne zorladı?"><input id="rv3" placeholder="Gelecek hafta neyi değiştiriyorsun?">
     <button class="btn-primary" id="rvsave">Kaydet</button></div>`:""}
   ${S.habits.map(h=>{const e=L[h.key];return `<div class="card habit">
     <div class="grow"><strong>${h.n}</strong><div class="meta">${h.t==="bool"?"Evet/Hayır":h.goal+" "+h.u+" · min "+h.mini+" "+h.u} · 🔥 ${streak(h)} gün · güç %${strength(h)}</div>
     ${e?`<span class="state ${e.lvl===2?"done":"mini"}">${e.lvl===2?"Tamam":"Minimum"} · ${h.t==="bool"?"✓":e.v+" "+h.u}</span>`:
       h.t==="bool"?"":`<div class="row" style="margin-top:6px"><input id="v-${h.key}" type="number" style="width:90px" placeholder="${h.goal}"><span class="small muted">${h.u}</span></div>`}
     </div>
     <div class="row" style="flex-direction:column;align-items:stretch">${e?`<button data-undo="${h.key}">Geri al</button>`:
       `<button class="btn-primary" data-done="${h.key}">✓ Yaptım</button><button class="btn-mini" data-mini="${h.key}">Mini (${h.t==="bool"?"✓":h.mini+" "+h.u})</button>`}</div>
   </div>`}).join("")}`;
}
function mark(k,lvl,v){const h=S.habits.find(x=>x.key===k);S.log[today]=S.log[today]||{};
  if(v==null)v=lvl===2?h.goal:h.mini; S.log[today][k]={v,lvl:v>=h.goal?2:1};save();render()}

/* ---------- İLERLEME ---------- */
function progHTML(){
  const cells=[];for(let k=83;k>=0;k--){const d=new Date();d.setDate(d.getDate()-k);const L=S.log[day(d)]||{};
    const sc=S.habits.reduce((a,h)=>a+(L[h.key]?(L[h.key].lvl===2?1:.5):0),0)/Math.max(1,S.habits.length);
    cells.push(`<i class="${sc===0?"":sc<.5?"l1":sc<1?"l2":"l3"}" title="${day(d)}"></i>`)}
  // ızgara: sütun=hafta
  const grid=[];for(let r=0;r<7;r++)for(let c=0;c<12;c++)grid.push(cells[c*7+r]);
  return `<h1>İlerleme</h1>${coachHTML()}
  <div class="card"><div class="eyebrow">Son 12 hafta</div><div class="heat">${grid.join("")}</div>
   <div class="small muted">Sarı = minimum gün, yeşil = tam gün. Kaçırmak seriyi bitirir ama gücü sadece yavaşça düşürür.</div></div>
  <h2>Alışkanlık gücü</h2>
  ${S.habits.map(h=>`<div class="card"><div class="row"><strong class="grow">${h.n}</strong><span class="num">%${strength(h)}</span></div>
   <div class="bar"><i style="width:${strength(h)}%"></i></div></div>`).join("")}
  <h2>Rozetler</h2>
  <div class="card">${badges().slice(0,8).map(b=>`<div class="row"><span class="grow">${b.ok?"🏅":"🔒"} <b>${b.t}</b><br><span class="small muted">${b.d}</span></span>
    ${b.ok?"":`<span class="num small">%${Math.round(b.p*100)}</span>`}</div>`).join("")}</div>
  <h2>Bu tempoyla 1 yılda</h2>
  <div class="card">${S.habits.map(h=>{const y=avgPerDay(h)*365;
    const txt=h.t==="bool"?`${Math.round(y)} gün`:h.u==="dk"?`${Math.round(y/60)} saat`:`${Math.round(y).toLocaleString("tr-TR")} ${h.u}`;
    const extra=h.u==="dk"&&/kitap|oku/i.test(h.n)?` ≈ ${Math.round(y/60/6)} kitap`:"";
    return `<div class="row"><span class="grow">${h.n}</span><b class="num">${txt}${extra}</b></div>`}).join("")}
   <div class="small muted">Son 30 günlük ortalamana göre. Küçük günler, büyük toplam.</div></div>`;
}

/* ---------- KOÇ (kural tabanlı; Flutter'da Ollama ile) ---------- */
function coachHTML(){
  const G=["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];const tips=[];
  const days=Object.keys(S.log).sort().slice(-28);
  S.habits.forEach(h=>{const miss=[0,0,0,0,0,0,0],tot=[0,0,0,0,0,0,0];let mini=0,n=0;
    days.forEach(d=>{const w=new Date(d).getDay();tot[w]++;const e=S.log[d][h.key];if(!e)miss[w]++;else{n++;if(e.lvl===1)mini++}});
    let wi=0;miss.forEach((m,i)=>{if(tot[i]&&m/tot[i]>miss[wi]/(tot[wi]||1))wi=i});
    if(tot[wi]&&miss[wi]/tot[wi]>=.5)tips.push(`<b>${h.n}</b>: ${G[wi]} günleri genelde kaçırıyorsun. O gün için saati değiştir ya da sadece minimumu hedefle.`);
    if(n&&mini/n>.4)tips.push(`<b>${h.n}</b>: günlerin çoğu minimumda kalıyor. Hedefi ${Math.round(h.goal*.7)} ${h.u}'ya indirmek seriyi güçlendirebilir.`);
    if(strength(h)>=75)tips.push(`<b>${h.n}</b> artık kimliğinin parçası (%${strength(h)}). Yeni bir alışkanlık slotu açmaya hazırsın.`);
  });
  const cnt={};Object.values(S.skips||{}).forEach(m=>Object.values(m).forEach(r=>cnt[r]=(cnt[r]||0)+1));
  const top=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0];
  const adv={"Unuttum":"En sık sebep \"unuttum\". Hatırlatıcı aç veya alışkanlığı sabit bir ana bağla.","Vakit yok":"En sık sebep \"vakit yok\". O günlerde sadece minimumu yap.","Yorgun":"En sık sebep yorgunluk. Alışkanlığı günün erken saatine al.","İsteksiz":"En sık sebep isteksizlik. Sadece başlamayı hedefle: 2 dakika kuralı."};
  if(top)tips.unshift(adv[top]);
  if(!tips.length)tips.push("Henüz yeterli veri yok. Birkaç gün işaretle, koç desenleri bulsun.");
  return `<div class="card"><div class="eyebrow">Koçun diyor ki</div>${tips.slice(0,3).map(t=>`<div class="small">• ${t}</div>`).join("")}</div>`;
}

/* ---------- PLAN (akış + mimari) ---------- */
function planHTML(){return `<h1>Ürün planı</h1>
 <div class="card"><h2>A · Ekran akışı (MVP)</h2><div class="flow">
  <div><b>1. Karşılama</b> — "Nasıl bir insan olmak istiyorsun?" kimlik seçimi</div>
  <div><b>2. Program</b> — hazır paket veya custom (ad, tip, hedef, minimum, kimlik). İlk 2 hafta max 3</div>
  <div><b>3. Hatırlatıcı</b> — saat seçimi, bildirim izni</div>
  <div><b>4. Bugün</b> — kartlar: Yaptım / Mini / miktar gir / timer; kimlik oyları</div>
  <div><b>5. Kaçırma</b> — ertesi gün "Ne oldu?" (yorgun / vakit yok / unuttum) → öneri</div>
  <div><b>6. İlerleme</b> — heatmap, güç, 1 yıllık projeksiyon, rozetler</div>
  <div><b>7. Haftalık değerlendirme</b> — Pazar, 3 soru, slot açılımı (seviye)</div>
 </div></div>
 <div class="card"><h2>B · Teknik mimari</h2>
  <div class="small"><b>Mobil:</b> Flutter (tek kod, iOS+Android) · Riverpod · Isar/SQLite (offline-first)<br>
  <b>Backend:</b> Supabase (Auth, Postgres, Edge Functions) · senkron arka planda<br>
  <b>Bildirim:</b> yerel bildirim + FCM · <b>Sağlık:</b> HealthKit / Health Connect (v2)<br>
  <b>AI koç (v2):</b> haftalık özet, Edge Function → LLM API<br>
  <b>Ödeme:</b> RevenueCat (premium abonelik)</div>
  <div class="eyebrow">Veri modeli</div>
<pre>User(id, name, identities[], level, created_at)
Habit(id, user_id, name, type[bool|dur|qty],
      goal, min_goal, unit, identity, schedule,
      stack_id, order, archived)

function bind(){
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{S.view=b.dataset.v;save();render();scrollTo(0,0)});
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{const k=b.dataset.done;const i=$("v-"+k);mark(k,2,i&&i.value?+i.value:null)});
  document.querySelectorAll("[data-mini]").forEach(b=>b.onclick=()=>mark(b.dataset.mini,1));
  document.querySelectorAll("[data-undo]").forEach(b=>b.onclick=()=>{delete S.log[today][b.dataset.undo];save();render()});
  document.querySelectorAll("[data-skip]").forEach(b=>b.onclick=()=>{S.skips=S.skips||{};(S.skips[yday()]=S.skips[yday()]||{})[b.dataset.skip]=b.dataset.r;save();render()});
  $("rvsave")&&($("rvsave").onclick=()=>{S.reviews=S.reviews||{};S.reviews[weekKey()]={iyi:$("rv1").value,zor:$("rv2").value,degisim:$("rv3").value};save();render()});
  $("reset")&&($("reset").onclick=()=>{S={onboarded:false,ids:[],habits:[],log:{},view:"today"};ob={step:0,ids:[],pack:null,custom:[]};save();render()});
}
if(!load()){S=seed();}
render();
</script>
