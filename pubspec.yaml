name: i_am_disiplin
description: Ben Disiplinim — rütbe tabanlı disiplin uygulaması
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.27.0 <4.0.0"
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  fl_chart: ^1.2.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/sozler.json
    - assets/exercises.json
    - assets/programs.json
    - lib/exercises.json
    - lib/programs.json
