name: Web yayını (iPhone için)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: web
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: flutter test
      # --no-web-resources-cdn: CanvasKit uygulamanın içinde gelir, dış CDN'e bağımlı kalmaz
      - run: flutter build web --release --no-web-resources-cdn --base-href /I_am_discipline/
      - run: cp build/web/index.html build/web/404.html
      # Derlenmiş uygulama gh-pages dalına gider.
      # GitHub > Settings > Pages > "Deploy from a branch" > gh-pages / (root) seçilince yayında olur.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Web derlemesi"
